<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok测试平台 - 授权中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #00f2ea 0%, #ff0050 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: #000;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        
        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 16px;
        }
        
        .auth-btn {
            background: #000;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 24px;
        }
        
        .auth-btn:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .auth-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status-container {
            margin-top: 24px;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            display: none;
        }
        
        .status-success {
            background: #f0fdf4;
            border: 1px solid #22c55e;
            color: #166534;
        }
        
        .status-error {
            background: #fef2f2;
            border: 1px solid #ef4444;
            color: #991b1b;
        }
        
        .status-loading {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #475569;
        }
        
        .status-title {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 18px;
        }
        
        .status-item {
            margin-bottom: 8px;
            font-size: 14px;
            word-break: break-all;
        }
        
        .status-item strong {
            display: inline-block;
            width: 100px;
        }
        
        .token-display {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 12px;
            font-family: monospace;
            word-break: break-all;
        }
        
        .footer {
            margin-top: 32px;
            color: #999;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .terms {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #aaa;
            text-align: left;
        }
        
        .saved-tokens {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
            text-align: left;
        }
        
        .saved-tokens h4 {
            margin-bottom: 12px;
            color: #1e293b;
        }
        
        .token-item {
            font-size: 11px;
            font-family: monospace;
            background: white;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            word-break: break-all;
        }
        
        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .clear-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎵</div>
        <h1>TikTok API测试平台</h1>
        <p class="subtitle">授权您的TikTok账号以使用API功能</p>
        
        <button id="authBtn" class="auth-btn">在新窗口打开TikTok授权</button>
        
        <div id="statusContainer" class="status-container">
            <div id="statusTitle" class="status-title"></div>
            <div id="statusContent"></div>
        </div>
        
        <div id="savedTokens" class="saved-tokens" style="display: none;">
            <h4>📦 已保存的Token</h4>
            <div id="tokenList"></div>
            <button id="clearTokensBtn" class="clear-btn">清除所有Token</button>
        </div>
        
        <div class="footer">
            TikTok测试平台 - 仅用于学术研究和沙盒测试
            <div class="terms">
                本应用为非商业学术项目，仅供开发者和授权测试用户使用。<br>
                Token将保存在浏览器本地，日志文件会自动下载。
            </div>
        </div>
    </div>

    <script>
        // TikTok配置
        const TIKTOK_CONFIG = {
            client_key: "sbaw5msf5yytbhz0b1",
            client_secret: "sUkEvJm5rzQHEQ522npxBnksCrWOrhNv",
            redirect_uri: "https://zuraw0610.github.io/tiktok-test/",
            scope: "user.info.basic,user.info.profile,user.info.stats,video.list,video.publish,video.upload"
        };
        
        // CORS代理（如果这个失效，可以换其他的）
        // 备选代理：https://api.allorigins.win/raw?url= , https://corsproxy.io/?
        const CORS_PROXY = "https://cors-anywhere.herokuapp.com/";
        
        // 存储key
        const STORAGE_KEY = "tiktok_tokens";
        
        // ========== 页面初始化 ==========
        window.addEventListener('load', async () => {
            // 检查URL参数（处理从TikTok回调回来的情况）
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');
            
            // 情况1：TikTok授权失败返回错误
            if (error) {
                showStatus('error', '授权被拒绝', `TikTok返回错误：${errorDescription || error}`);
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }
            
            // 情况2：TikTok授权成功返回code和state（回调页面）
            if (code && state) {
                await handleCallback(code, state);
                // 清理URL参数，防止刷新重复处理
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }
            
            // 情况3：正常访问，显示已保存的token
            displaySavedTokens();
        });
        
        // ========== 点击授权按钮（新窗口打开） ==========
        document.getElementById('authBtn').addEventListener('click', async () => {
            const btn = document.getElementById('authBtn');
            btn.disabled = true;
            btn.textContent = "正在生成授权链接...";
            
            try {
                // 生成state参数
                const state = generateState();
                
                // 构造TikTok授权链接
                const authUrl = `https://www.tiktok.com/v2/auth/authorize/?${new URLSearchParams({
                    client_key: TIKTOK_CONFIG.client_key,
                    scope: TIKTOK_CONFIG.scope,
                    response_type: "code",
                    redirect_uri: TIKTOK_CONFIG.redirect_uri,
                    state: state
                })}`;
                
                // 在新窗口打开授权页面
                const authWindow = window.open(authUrl, "_blank", "width=600,height=700,left=200,top=100");
                
                if (!authWindow) {
                    showStatus('error', '弹窗被拦截', '请允许弹出窗口，或手动点击授权链接');
                    btn.disabled = false;
                    btn.textContent = "在新窗口打开TikTok授权";
                    return;
                }
                
                // 保存state到sessionStorage用于验证
                sessionStorage.setItem("oauth_state", state);
                sessionStorage.setItem("oauth_start_time", Date.now().toString());
                
                showStatus('loading', '等待授权...', '已在新窗口打开TikTok授权页面，请完成登录并授权。\n授权完成后，当前页面会自动处理。');
                
                btn.disabled = false;
                btn.textContent = "在新窗口打开TikTok授权";
                
                // 设置定时器，定期检查是否已经处理过回调
                let checkInterval = setInterval(() => {
                    if (sessionStorage.getItem("callback_processed") === "true") {
                        clearInterval(checkInterval);
                        sessionStorage.removeItem("callback_processed");
                    }
                }, 1000);
                
            } catch (error) {
                showStatus('error', '生成授权链接失败', error.message);
                btn.disabled = false;
                btn.textContent = "在新窗口打开TikTok授权";
            }
        });
        
        // ========== 处理授权回调 ==========
        async function handleCallback(code, state) {
            // 验证state（可选）
            const savedState = sessionStorage.getItem("oauth_state");
            if (savedState && savedState !== state) {
                showStatus('error', '安全验证失败', 'state参数不匹配，可能是CSRF攻击');
                return;
            }
            
            // 标记回调已处理
            sessionStorage.setItem("callback_processed", "true");
            
            showStatus('loading', '正在处理授权...', '正在获取访问令牌，请稍候...');
            
            try {
                // 调用TikTok Token接口
                const tokenData = await exchangeCodeForToken(code);
                
                if (tokenData.access_token) {
                    // 保存token信息
                    const tokenInfo = {
                        id: Date.now(),
                        access_token: tokenData.access_token,
                        refresh_token: tokenData.refresh_token,
                        expires_in: tokenData.expires_in,
                        scope: tokenData.scope,
                        token_type: tokenData.token_type,
                        obtained_at: new Date().toISOString(),
                        account_name: `授权账号_${formatDateTime(new Date())}`
                    };
                    
                    // 保存到localStorage
                    saveTokenToStorage(tokenInfo);
                    
                    // 下载日志文件
                    downloadTokenLog(tokenInfo);
                    
                    // 显示成功信息
                    showStatus('success', '🎉 授权成功！', `
                        <div class="status-item"><strong>账号名称：</strong>${tokenInfo.account_name}</div>
                        <div class="status-item"><strong>授权权限：</strong>${tokenInfo.scope.split(',').join(', ')}</div>
                        <div class="status-item"><strong>有效期：</strong>${Math.round(tokenInfo.expires_in / 3600)} 小时</div>
                        <div class="status-item"><strong>Access Token：</strong><span style="font-family: monospace; font-size: 11px;">${tokenInfo.access_token.substring(0, 30)}...</span></div>
                        <div class="status-item"><strong>Refresh Token：</strong><span style="font-family: monospace; font-size: 11px;">${tokenInfo.refresh_token.substring(0, 30)}...</span></div>
                        <div class="status-item" style="margin-top: 16px; color: #22c55e; font-weight: 500;">
                            ✅ Token已保存到浏览器，日志文件已自动下载
                        </div>
                    `);
                    
                    // 刷新显示的token列表
                    displaySavedTokens();
                } else {
                    showStatus('error', '获取Token失败', tokenData.error?.message || JSON.stringify(tokenData));
                }
            } catch (error) {
                showStatus('error', '请求失败', error.message);
            }
        }
        
        // ========== 用code换取token ==========
        async function exchangeCodeForToken(code) {
            const tokenUrl = "https://open.tiktokapis.com/v2/oauth/token/";
            
            // 方法1：尝试使用CORS代理
            try {
                const params = new URLSearchParams();
                params.append("client_key", TIKTOK_CONFIG.client_key);
                params.append("client_secret", TIKTOK_CONFIG.client_secret);
                params.append("grant_type", "authorization_code");
                params.append("code", code);
                params.append("redirect_uri", TIKTOK_CONFIG.redirect_uri);
                
                // 尝试多个CORS代理
                const proxies = [
                    "https://cors-anywhere.herokuapp.com/",
                    "https://api.allorigins.win/raw?url=",
                    "https://corsproxy.io/?"
                ];
                
                for (const proxy of proxies) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 10000);
                        
                        let url = proxy + tokenUrl;
                        let body = params;
                        let headers = { "Content-Type": "application/x-www-form-urlencoded" };
                        
                        // 特殊处理allorigins代理
                        if (proxy.includes("allorigins")) {
                            url = proxy + encodeURIComponent(tokenUrl);
                            body = params.toString();
                        }
                        
                        const response = await fetch(url, {
                            method: "POST",
                            headers: headers,
                            body: body,
                            signal: controller.signal
                        });
                        
                        clearTimeout(timeoutId);
                        const data = await response.json();
                        
                        if (data.access_token) {
                            return data;
                        }
                    } catch (e) {
                        console.log(`代理 ${proxy} 失败:`, e.message);
                        continue;
                    }
                }
                
                throw new Error("所有CORS代理均失败");
                
            } catch (error) {
                console.error("Token获取失败:", error);
                throw new Error(`无法获取Token: ${error.message}<br><br>建议使用Postman手动获取：<br>1. 复制code: ${code}<br>2. 在Postman中POST到 ${tokenUrl}<br>3. 参数见文档`);
            }
        }
        
        // ========== 保存Token到localStorage ==========
        function saveTokenToStorage(tokenInfo) {
            const tokens = getStoredTokens();
            tokens.unshift(tokenInfo); // 最新的放前面
            // 只保留最近10个
            if (tokens.length > 10) tokens.pop();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tokens));
        }
        
        function getStoredTokens() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }
        
        // ========== 显示已保存的Token ==========
        function displaySavedTokens() {
            const tokens = getStoredTokens();
            const container = document.getElementById('savedTokens');
            const tokenList = document.getElementById('tokenList');
            
            if (tokens.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            tokenList.innerHTML = tokens.map(token => `
                <div class="token-item">
                    <div><strong>📅 ${new Date(token.obtained_at).toLocaleString('zh-CN')}</strong></div>
                    <div>账号: ${token.account_name}</div>
                    <div>有效期: ${Math.round(token.expires_in / 3600)}小时</div>
                    <div style="font-size: 10px; color: #666; margin-top: 4px;">
                        Access: ${token.access_token.substring(0, 20)}...
                    </div>
                </div>
            `).join('');
        }
        
        // ========== 下载Token日志文件 ==========
        function downloadTokenLog(tokenInfo) {
            const now = new Date(tokenInfo.obtained_at);
            const expireTime = new Date(now.getTime() + tokenInfo.expires_in * 1000);
            const fileName = `${now.toISOString().slice(0,19).replace(/:/g, '-')}_${tokenInfo.account_name}.md`;
            
            const logContent = `# TikTok账号授权日志

## 基本信息
- 账号名称：${tokenInfo.account_name}
- 授权时间：${now.toLocaleString('zh-CN')}
- Token过期时间：${expireTime.toLocaleString('zh-CN')}
- 有效期：${Math.round(tokenInfo.expires_in / 3600)} 小时
- Token类型：${tokenInfo.token_type}

## Token信息
\`\`\`
Access Token: ${tokenInfo.access_token}
Refresh Token: ${tokenInfo.refresh_token}
\`\`\`

## 权限范围
${tokenInfo.scope.split(',').join('\n')}

## 使用说明
将Access Token填入API请求的Authorization头：
\`\`\`
Authorization: Bearer ${tokenInfo.access_token}
\`\`\`

---
生成时间：${new Date().toLocaleString('zh-CN')}
`;
            
            const blob = new Blob([logContent], {type: "text/markdown;charset=utf-8"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
        
        // ========== 清除所有Token ==========
        document.getElementById('clearTokensBtn')?.addEventListener('click', () => {
            if (confirm('确定要清除所有保存的Token吗？')) {
                localStorage.removeItem(STORAGE_KEY);
                displaySavedTokens();
                showStatus('success', '已清除', '所有保存的Token已清除');
            }
        });
        
        // ========== 辅助函数 ==========
        function generateState() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        function formatDateTime(date) {
            return `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}_${String(date.getHours()).padStart(2,'0')}${String(date.getMinutes()).padStart(2,'0')}${String(date.getSeconds()).padStart(2,'0')}`;
        }
        
        function showStatus(type, title, content) {
            const container = document.getElementById('statusContainer');
            const titleEl = document.getElementById('statusTitle');
            const contentEl = document.getElementById('statusContent');
            
            container.className = `status-container status-${type}`;
            titleEl.textContent = title;
            contentEl.innerHTML = content;
            container.style.display = 'block';
        }
        
        // 监听页面可见性变化（当从授权窗口返回时自动刷新）
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // 页面重新可见时，检查URL是否有code
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const state = urlParams.get('state');
                if (code && state && !sessionStorage.getItem("callback_processed")) {
                    handleCallback(code, state);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        });
    </script>
</body>
</html>
