<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok测试平台 - 授权中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #00f2ea 0%, #ff0050 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: #000;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        
        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 16px;
        }
        
        .auth-btn {
            background: #000;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 24px;
        }
        
        .auth-btn:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .auth-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status-container {
            margin-top: 24px;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            display: none;
        }
        
        .status-success {
            background: #f0fdf4;
            border: 1px solid #22c55e;
            color: #166534;
        }
        
        .status-error {
            background: #fef2f2;
            border: 1px solid #ef4444;
            color: #991b1b;
        }
        
        .status-loading {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #475569;
        }
        
        .status-title {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 18px;
        }
        
        .status-item {
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .status-item strong {
            display: inline-block;
            width: 100px;
        }
        
        .footer {
            margin-top: 32px;
            color: #999;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .terms {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #aaa;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎵</div>
        <h1>TikTok API测试平台</h1>
        <p class="subtitle">授权您的TikTok账号以使用API功能</p>
        
        <button id="authBtn" class="auth-btn" disabled>使用TikTok账号授权</button>
        
        <div id="statusContainer" class="status-container">
            <div id="statusTitle" class="status-title"></div>
            <div id="statusContent"></div>
        </div>
        
        <div class="footer">
            TikTok测试平台 - 仅用于学术研究和沙盒测试
            <div class="terms">
                本应用为非商业学术项目，仅供开发者和授权测试用户使用。
                所有授权令牌仅存储在本地服务器，不会分享给任何第三方。
            </div>
        </div>
    </div>

    <script>
        // 后端API地址（本地开发用127.0.0.1，部署后改为你的服务器公网IP）
        const API_BASE_URL = "http://127.0.0.1:8001";
        
        // 页面加载时执行
        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');
            
            // 情况1：TikTok授权失败返回错误
            if (error) {
                showStatus('error', '授权被拒绝', `TikTok返回错误：${errorDescription || error}`);
                document.getElementById('authBtn').disabled = false;
                document.getElementById('authBtn').textContent = "重新授权";
                // 清理URL参数，防止刷新重复显示
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }
            
            // 情况2：TikTok授权成功返回code和state
            if (code && state) {
                await handleCallback(code, state);
                // 处理完成后清理URL参数
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }
            
            // 情况3：正常访问，显示授权按钮
            document.getElementById('authBtn').disabled = false;
        });
        
        // 点击授权按钮
        document.getElementById('authBtn').addEventListener('click', async () => {
            const btn = document.getElementById('authBtn');
            btn.disabled = true;
            btn.textContent = "正在生成授权链接...";
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/generate-url`);
                const data = await response.json();
                
                if (data.success) {
                    // 跳转到TikTok官方授权页面
                    window.location.href = data.auth_url;
                } else {
                    showStatus('error', '生成授权链接失败', data.message);
                    btn.disabled = false;
                    btn.textContent = "使用TikTok账号授权";
                }
            } catch (error) {
                showStatus('error', '服务器连接失败', `无法连接到后端服务：${error.message}<br>请确保后端服务已在 ${API_BASE_URL} 运行`);
                btn.disabled = false;
                btn.textContent = "使用TikTok账号授权";
            }
        });
        
        // 处理授权回调
        async function handleCallback(code, state) {
            document.getElementById('authBtn').style.display = 'none';
            showStatus('loading', '正在处理授权...', '正在与TikTok服务器通信，获取访问令牌...');
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`);
                const data = await response.json();
                
                if (data.success) {
                    showStatus('success', '🎉 授权成功！', `
                        <div class="status-item"><strong>账号名称：</strong>${data.account_name}</div>
                        <div class="status-item"><strong>授权权限：</strong>${data.scope.split(',').join(', ')}</div>
                        <div class="status-item"><strong>有效期：</strong>${Math.round(data.expires_in / 3600)} 小时</div>
                        <div class="status-item"><strong>日志文件：</strong>${data.log_file}</div>
                        <div class="status-item" style="margin-top: 16px; color: #166534; font-weight: 500;">
                            授权信息已保存到服务器配置，您现在可以返回主平台使用API功能
                        </div>
                    `);
                } else {
                    showStatus('error', '授权失败', data.message);
                    document.getElementById('authBtn').style.display = 'block';
                    document.getElementById('authBtn').disabled = false;
                    document.getElementById('authBtn').textContent = "重新授权";
                }
            } catch (error) {
                showStatus('error', '服务器连接失败', `无法连接到后端服务：${error.message}<br>请确保后端服务已在 ${API_BASE_URL} 运行`);
                document.getElementById('authBtn').style.display = 'block';
                document.getElementById('authBtn').disabled = false;
                document.getElementById('authBtn').textContent = "重新授权";
            }
        }
        
        // 显示状态信息
        function showStatus(type, title, content) {
            const container = document.getElementById('statusContainer');
            const titleEl = document.getElementById('statusTitle');
            const contentEl = document.getElementById('statusContent');
            
            container.className = `status-container status-${type}`;
            titleEl.textContent = title;
            contentEl.innerHTML = content;
            container.style.display = 'block';
        }
    </script>
</body>
</html>
